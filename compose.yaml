services:
  # Local development database
  postgres:
    image: postgres:16-alpine
    container_name: eabyai-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eabyai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js dev server (hot reload)
  web-dev:
    build:
      context: .
      dockerfile: dockerfile.dev
    container_name: eabyai-web-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/eabyai
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    network_mode: bridge
    profiles:
      - dev

  # Next.js production server (built artifacts)
  web:
    build:
      context: .
      dockerfile: dockerfile
    container_name: eabyai-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/eabyai
    depends_on:
      postgres:
        condition: service_healthy
    network_mode: bridge
    profiles:
      - prod

volumes:
  postgres_data:
